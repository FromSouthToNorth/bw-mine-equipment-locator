<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Test Cesium</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>html,body,#cesiumContainer{width:100%;height:100%;margin:0;padding:0;}</style>
</head>
<body>
<div id="cesiumContainer"></div>
<script>
const viewer = new Cesium.Viewer('cesiumContainer', {
  animation: false, timeline: false, baseLayerPicker: false,
  geocoder: false, homeButton: false, sceneModePicker: false,
  navigationHelpButton: false, fullscreenButton: false,
});

// 一条简单的测试折线
const positions = Cesium.Cartesian3.fromDegreesArrayHeights([
  96.61, 41.71, 1670,
  96.62, 41.72, 1680,
  96.63, 41.73, 1690,
]);

viewer.entities.add({
  polyline: {
    positions: positions,
    width: 5,
    material: Cesium.Color.RED,
  },
});

viewer.entities.add({
  position: Cesium.Cartesian3.fromDegrees(96.62, 41.72, 1700),
  point: { pixelSize: 15, color: Cesium.Color.GREEN },
});

viewer.camera.flyTo({
  destination: Cesium.Cartesian3.fromDegrees(96.62, 41.72, 5000),
  orientation: { heading: 0, pitch: Cesium.Math.toRadians(-45), roll: 0 },
});
</script>
</body>
</html>
